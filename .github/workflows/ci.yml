name: Core software and memory budget

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The pinned Gymnasium-based emulator releases require Python 3.13+.
          python-version: '3.13'
      - name: Install core and real Mario smoke-test dependencies
        run: python -m pip install numpy scipy pandas pyarrow pyyaml torch networkx matplotlib pytest gymnasium 'gym-super-mario-bros==9.1.0' 'nes-py==9.0.1'
      - name: Install video encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip check
      - name: Core numerics, Colab notebooks, real NES resume and memory budget
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m pytest tests -q

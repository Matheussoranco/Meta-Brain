name: Core software and memory budget

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies for the core suite (not the Mario application)
        run: python -m pip install numpy scipy pandas pyyaml torch networkx pytest
      - run: python -m pip check
      - name: Core numerics and dense allocation budget
        run: python -m pytest tests -q
